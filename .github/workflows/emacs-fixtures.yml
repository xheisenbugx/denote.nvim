name: Emacs Denote fixtures

# Regenerates tests/fixtures/emacs with the latest Denote from GNU ELPA and fails when the
# output drifts from what is committed, so new Denote releases surface behaviour changes.
# (The parity spec itself runs on every push as part of `make test` in ci.yml.)

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - name: Regenerate fixtures with the real Emacs Denote
        run: make fixtures
      - name: Fail on drift
        run: |
          if ! git diff --exit-code tests/fixtures; then
            echo "::error::Emacs Denote output changed. Run 'make fixtures', review the diff and update denote.nvim (or KNOWN_DIFFERENCES in tests/spec/emacs_parity_spec.lua)."
            exit 1
          fi
          if [ -n "$(git status --porcelain tests/fixtures)" ]; then
            git status --porcelain tests/fixtures
            echo "::error::make fixtures produced untracked fixture files."
            exit 1
          fi
