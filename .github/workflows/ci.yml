name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.neovim }}${{ matrix.ripgrep && ', rg' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        neovim: ["v0.10.4", "v0.11.0", "nightly"]
        ripgrep: [false]
        include:
          # Exercise the ripgrep backend and macOS path handling (/var -> /private/var symlinks)
          - os: ubuntu-latest
            neovim: "v0.11.0"
            ripgrep: true
          - os: macos-latest
            neovim: "v0.11.0"
            ripgrep: true
          - os: macos-latest
            neovim: "nightly"
            ripgrep: false
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install ripgrep
        if: matrix.ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get update && sudo apt-get install -y ripgrep; fi
      - name: Hide ripgrep
        if: ${{ !matrix.ripgrep }}
        run: |
          # Make sure the pure-Lua fallback is what gets tested on these jobs
          for p in $(which -a rg 2>/dev/null); do sudo mv "$p" "$p.disabled"; done
      - name: Run headless tests
        run: make test

  typecheck:
    runs-on: ubuntu-latest
    env:
      LUALS_VERSION: "3.19.2"
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.0
      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/luals"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: make typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests scripts
