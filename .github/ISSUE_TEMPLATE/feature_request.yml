name: Feature request
description: Suggest an idea or an Emacs Denote feature that is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Commands, keymaps, or options you have in mind. Link the Emacs Denote equivalent if there is one.
    validations:
      required: true
