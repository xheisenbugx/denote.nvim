name: Bug report
description: Something in denote.nvim does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal config (`nvim -u repro.lua`) and the exact keys / commands, if possible.
      placeholder: |
        1. Create a note with `:Denote`
        2. ...
    validations:
      required: true
  - type: textarea
    id: emacs
    attributes:
      label: Emacs Denote behaviour (if relevant)
      description: If this is a parity issue, what does Emacs Denote do with the same file or link?
  - type: textarea
    id: health
    attributes:
      label: ":checkhealth denote"
      description: Paste the output of `:checkhealth denote`.
      render: text
    validations:
      required: true
  - type: input
    id: nvim
    attributes:
      label: Neovim version
      description: Output of `nvim --version | head -1`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
